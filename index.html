<!DOCTYPE html>
<html>
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Dost AI</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
      background-color: #f4f4f9;
    }
    .btn {
      background-color: #ff5722;
      color: white;
      padding: 16px 30px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      display: inline-block;
      margin-top: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .content {
      margin-top: 40px;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Welcome to Study Dost AI</h1>
  <p>Click below to start learning</p>

  <button onclick="openAdAndStudy()" class="btn">Start Learning</button>

  <div id="studyContent" class="content" style="display: none;">
    <h2>📚 Welcome to Study Area</h2>
    <p>Select your class and start studying freely.</p>
  </div>

  <script>
    function openAdAndStudy() {
      // 1. Ad ko external browser/tab mein force karo
      var adUrl = "https://uplcm.com/4/12030229";
      window.open(adUrl, '_system');
      
      // 2. App ke andar hi content turant dikha do
      document.getElementById('studyContent').style.display = 'block';
    }
  </script>
</body>
</html>
